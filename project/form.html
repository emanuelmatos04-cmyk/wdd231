    <nav>

  <main>
    <h1>Join Our Community</h1>
    <section>
      <p>Fill out the form below to become part of the Santo Domingo Cultural Hub. Your participation helps us grow and celebrate our culture together.</p>
      
      <form action="thankyou.html" method="post">
        <label for="name">Full Name:</label>
        <input type="text" id="name" name="name" required>

        <label for="email">Email Address:</label>
        <input type="email" id="email" name="email" required>

        <label for="interest">Area of Interest:</label>
        <select id="interest" name="interest" required>
          <option value="">--Select--</option>
          <option value="music">Music</option>
          <option value="dance">Dance</option>
          <option value="art">Art</option>
          <option value="community">Community Service</option>
        </select>

        <label for="message">Tell us why you want to join:</label>
        <textarea id="message" name="message" rows="4"></textarea>

        <button type="submit">Join Us</button>
      </form>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Emanuel Matos — Santo Domingo, Dominican Republic</p>

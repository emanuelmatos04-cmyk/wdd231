<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Join cultural events in Santo Domingo">
  <meta name="author" content="Emanuel Matos">
  <title>Join Us - Santo Domingo Cultural Hub</title>
  <link rel="stylesheet" href="styles/normalize.css">
  <link rel="stylesheet" href="styles/small.css">
  <link rel="stylesheet" href="styles/large.css" media="screen and (min-width:1024px)">
</head>
<body>
  <header>
    <h1>Join Us</h1>
    <nav>
      <button id="menu">☰</button>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="events.html">Events</a></li>
        <li><a href="form.html">Join Us</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section>
      <h2>Submit Your Interest</h2>
      <form id="interestForm" action="form-action.html" method="get">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required>

        <label for="event">Event:</label>
        <input type="text" id="event" name="event" required>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>

        <button type="submit">Submit</button>
      </form>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Emanuel Matos — Santo Domingo, Dominican Republic</p>
    <p id="date"></p>
    <p><a href="attributions.html">Attributions</a> | <a href="https://youtube.com/yourvideo" target="_blank">Demo Video</a></p>
  </footer>
  <script type="module" src="scripts.js"></script>
</body>
</html>
